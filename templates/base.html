{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LitFlow | {% block title %}Книжный магазин{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header id="main-header">
        <div class="container header-content">
            <a href="{% url 'core:home' %}" class="logo">
                <i class="fas fa-book-open"></i> LitFlow
            </a>
            <div class="search-container">
                <form action="{% url 'core:search' %}" method="get">
                    <input type="text" name="q" placeholder="Поиск...">
                    <button type="submit"><i class="fas fa-search"></i></button>
                </form>
            </div>
            <nav class="nav-links">
                <a href="{% url 'core:home' %}">Главная</a>
                <a href="{% url 'core:catalog' %}">Каталог</a>
                <a href="{% url 'core:cart_detail' %}">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="badge">{{ cart|length }}</span>
                </a>
                {% if user.is_authenticated %}
                    <a href="{% url 'core:profile' %}">Профиль</a>
                {% else %}
                    <a href="{% url 'login' %}">Войти</a>
                {% endif %}
            </nav>
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer>
        <div class="container">
            <p>&copy; 2026 LitFlow. Все права защищены.</p>
        </div>
    </footer>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
