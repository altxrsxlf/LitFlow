{% extends "base.html" %}
{% block title %}{{ book.title }}{% endblock %}
{% block content %}
<div class="container" style="margin-top: 40px;">
    <div class="card" style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 40px;">
        <div class="book-image-container">
            {% if book.image %}
            <img src="{{ book.image.url }}" alt="{{ book.title }}" style="width: 100%; border-radius: var(--radius); box-shadow: var(--shadow);">
            {% else %}
            <div style="width: 100%; height: 400px; background: var(--surface-light); display: flex; align-items: center; justify-content: center; border-radius: var(--radius);">
                <i class="fas fa-book" style="font-size: 5rem; color: var(--text-muted);"></i>
            </div>
            {% endif %}
        </div>
        <div class="book-info-container">
            <span class="card-category" style="font-size: 1rem; margin-bottom: 10px; display: block;">{{ book.category.name }}</span>
            <h1 style="font-size: 2.5rem; margin-bottom: 10px;">{{ book.title }}</h1>
            <h3 style="color: var(--accent); margin-bottom: 20px;">{{ book.author }}</h3>
            
            <div style="font-size: 1.1rem; line-height: 1.8; color: var(--text-muted); margin-bottom: 30px;">
                {{ book.description|linebreaks }}
            </div>

            <div style="display: flex; align-items: center; gap: 20px; margin-top: 20px;">
                <span class="price" style="font-size: 2rem;">{{ book.price }} ₽</span>
                <form action="{% url 'core:cart_add' book.id %}" method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-primary" style="padding: 15px 30px; font-size: 1.1rem;">
                        <i class="fas fa-shopping-cart"></i> В корзину
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
