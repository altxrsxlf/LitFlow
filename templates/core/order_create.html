{% extends "base.html" %}
{% block title %}Оформление заказа{% endblock %}
{% block content %}
<div class="container" style="margin-top: 40px; max-width: 600px;">
    <div class="card" style="padding: 40px;">
        <h1 style="margin-bottom: 30px; text-align: center;">Оформление заказа</h1>
        <form method="post">
            {% csrf_token %}
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                <div>
                    <label style="display: block; margin-bottom: 5px; color: var(--text-muted);">Имя</label>
                    <input type="text" name="first_name" required style="width: 100%; padding: 10px; background: var(--bg-dark); border: 1px solid var(--border); color: var(--text-main); border-radius: 5px;">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 5px; color: var(--text-muted);">Фамилия</label>
                    <input type="text" name="last_name" required style="width: 100%; padding: 10px; background: var(--bg-dark); border: 1px solid var(--border); color: var(--text-main); border-radius: 5px;">
                </div>
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; color: var(--text-muted);">Email</label>
                <input type="email" name="email" required style="width: 100%; padding: 10px; background: var(--bg-dark); border: 1px solid var(--border); color: var(--text-main); border-radius: 5px;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; color: var(--text-muted);">Адрес доставки</label>
                <textarea name="address" rows="3" required style="width: 100%; padding: 10px; background: var(--bg-dark); border: 1px solid var(--border); color: var(--text-main); border-radius: 5px;"></textarea>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
                <div>
                    <label style="display: block; margin-bottom: 5px; color: var(--text-muted);">Индекс</label>
                    <input type="text" name="postal_code" required style="width: 100%; padding: 10px; background: var(--bg-dark); border: 1px solid var(--border); color: var(--text-main); border-radius: 5px;">
                </div>
                <div>
                    <label style="display: block; margin-bottom: 5px; color: var(--text-muted);">Город</label>
                    <input type="text" name="city" required style="width: 100%; padding: 10px; background: var(--bg-dark); border: 1px solid var(--border); color: var(--text-main); border-radius: 5px;">
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 15px;">Подтвердить заказ</button>
        </form>
    </div>
</div>
{% endblock %}
